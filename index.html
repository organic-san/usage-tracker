<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usage Tracker</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!--
      版面:上方標題列、左側服務側欄,其餘是舞台。
      官方頁面是 Rust 端建立的子 webview,依前端回報的舞台位置蓋在舞台上,
      任何 HTML 都無法疊在它上面,所以介面不使用浮動元件(選單改用原生選單)。
    -->
    <header class="topbar" data-tauri-drag-region="deep">
      <div class="brand"><span class="brand-dot"></span></div>
      <div class="now">
        <span class="now-dot" id="nowDot" hidden></span>
        <span class="now-title" id="nowTitle"></span>
      </div>
      <div class="timer">
        <button class="timer-btn" id="refreshBtn">
          <span class="timer-icon" id="refreshIcon"></span>
          <span id="countdown"></span>
        </button>
        <button class="icon-btn" id="pauseBtn"></button>
      </div>
      <span class="sep"></span>
      <div class="win-actions">
        <button class="icon-btn" id="pinBtn"></button>
        <button class="icon-btn" id="minBtn" title="最小化"></button>
        <button class="icon-btn danger" id="closeBtn" title="關閉"></button>
      </div>
      <div class="progress"><span id="progress"></span></div>
    </header>

    <nav class="rail" data-tauri-drag-region="deep">
      <div class="rail-list" id="railList"></div>
      <div class="rail-foot">
        <button class="icon-btn" id="splitBtn"></button>
        <button class="icon-btn" id="dirBtn" hidden></button>
        <button class="icon-btn" id="settingsBtn" title="設定 (Ctrl+,)"></button>
      </div>
    </nav>

    <main class="stage" id="stage">
      <div class="tiles" id="tiles"></div>

      <div class="empty" id="empty" hidden>
        <p>還沒有任何服務</p>
        <button class="btn primary" id="emptyAdd">新增服務</button>
      </div>

      <section class="settings" id="settings" hidden>
        <div class="settings-inner">
          <div class="settings-head">
            <h1>設定</h1>
            <button class="icon-btn" id="settingsClose" title="關閉設定 (Esc)"></button>
          </div>

          <section class="group">
            <div class="group-head">
              <h2>服務</h2>
              <button class="btn small" id="addService"></button>
            </div>
            <p class="hint">
              拖曳左側把手調整順序,側欄與並排都依這個順序排列。
              第一次開啟某個服務時,在頁面中正常登入一次即可。
            </p>
            <ul class="svc-list" id="svcList"></ul>
          </section>

          <section class="group">
            <div class="group-head"><h2>自動刷新</h2></div>
            <label class="row">
              <span>重新載入間隔</span>
              <select class="select" id="interval"></select>
            </label>
            <p class="hint">
              每次刷新都會重新載入整個官方頁面。用量數字不會每幾秒就變,太頻繁只會造成閃爍與耗電。
              視窗最小化時會暫停刷新;不在畫面上的頁面超過 30 分鐘會自動釋放記憶體,切換回來時重新載入。
            </p>
          </section>

          <section class="group">
            <div class="group-head"><h2>視窗</h2></div>
            <label class="row">
              <span>永遠置頂</span>
              <input type="checkbox" class="switch" id="alwaysOnTop" />
            </label>
            <label class="row">
              <span>開機時自動啟動</span>
              <input type="checkbox" class="switch" id="autostart" />
            </label>
          </section>

          <footer class="settings-foot" id="version"></footer>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
