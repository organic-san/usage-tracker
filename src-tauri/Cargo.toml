[package]
name = "usage-tracker"
version = "1.0.1"
description = "Embeds Claude & Gemini official usage pages with always-on-top + autostart."
authors = ["you"]
edition = "2021"

[lib]
name = "usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
